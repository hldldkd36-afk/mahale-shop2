<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت فروشگاه | لوازم جانبی محله</title><link rel="stylesheet" href="/styles.css"></head>
<body class="admin-body"><header class="admin-top"><a class="brand" href="/"><span class="brand-mark">م</span><span>مدیریت <b>محله</b></span></a><a href="/">بازگشت به فروشگاه ↗</a></header>
<main class="admin-wrap">
<section id="loginPanel" class="login-card"><span class="eyebrow">مدیریت فروشگاه</span><h1>ورود مدیر</h1><p>برای مشاهده سفارش‌ها و مدیریت محتوا وارد شوید.</p><form id="loginForm"><label>ایمیل<input name="email" type="email" required placeholder="admin@example.com"></label><label>رمز عبور<input name="password" type="password" required></label><button class="primary-btn full">ورود به پنل</button><p id="loginMessage" class="form-message"></p></form></section>
<section id="dashboard" hidden><div class="admin-heading"><div><span class="eyebrow">پنل اختصاصی</span><h1>داشبورد مدیریت</h1></div><button id="logoutBtn" class="outline-btn">خروج</button></div>
<div class="stats"><div><small>کل سفارش‌ها</small><b id="statOrders">۰</b></div><div><small>سفارش‌های جدید</small><b id="statNew">۰</b></div><div><small>مجموع سفارش‌ها (تومان)</small><b id="statSales">۰</b></div></div>
<div class="admin-grid"><section class="admin-card"><div class="card-title"><h2>سفارش‌های مشتریان</h2><button id="refreshOrders" class="outline-btn">به‌روزرسانی</button></div><div id="ordersTable" class="table-wrap">در حال دریافت…</div></section>
<section class="admin-card"><h2>افزودن محصول</h2><form id="productForm" class="stack-form"><label>نام محصول<input name="name" required></label><label>قیمت (تومان)<input name="price" type="number" min="0" required></label><label>موجودی<input name="stock" type="number" min="0" value="1"></label><label>آدرس تصویر<input name="image_url" type="url" placeholder="https://…"></label><label>توضیحات<textarea name="description" rows="3"></textarea></label><button class="primary-btn">ذخیره محصول در دیتابیس</button><p id="productMessage" class="form-message"></p></form></section>
<section class="admin-card"><h2>انتشار مطلب جدید</h2><form id="postForm" class="stack-form"><label>عنوان<input name="title" required></label><label>خلاصه<input name="excerpt"></label><label>متن مطلب<textarea name="body" rows="4"></textarea></label><label>آدرس تصویر<input name="image_url" type="url"></label><button class="primary-btn">انتشار مطلب</button><p id="postMessage" class="form-message"></p></form></section></div></section>
</main><script src="/admin.js"></script></body></html>
